'use strict';
const TODAY=(()=>{const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}`})();
const TOPICS=[
['mat-ops','Matrix operations','2026-09-17','Core Pure','Add, multiply and combine matrices. Matrix multiplication is not commutative.','For AB, row i times column j gives entry (i,j). To evaluate a matrix polynomial, calculate products before adding.','Always check order: AB and BA can be different.'],
['mat-trans','Matrix transformations','2026-09-24','Core Pure','Use 2×2 matrices to transform points, combine transformations and interpret determinants.','The columns of a transformation matrix are images of the unit basis vectors. Applying A then B gives BA.','Transformation order matters; read composition from right to left.'],
['mat-invline','Matrix invariance','2026-09-24','Core Pure','Identify invariant points and lines under a linear transformation.','A line through the origin with direction v is invariant if Av=λv. A point is fixed if Av=v.','An invariant line need not consist entirely of fixed points.'],
['mat-det','Determinants and inverses','2026-10-01','Core Pure','Find determinants, inverses, and solve simultaneous equations with matrices.','For [[a,b],[c,d]], determinant is ad−bc and inverse is (1/det)[[d,−b],[−c,a]].','A zero determinant means there is no inverse.'],
['cx-basics','Complex numbers: algebra','2026-10-05','Core Pure','Perform calculations with a+bi, conjugates and division.','Use i²=−1. Multiply the numerator and denominator by the complex conjugate when dividing.','When squaring bi, remember the sign changes.'],
['cx-argand','Argand diagrams','2026-10-05','Core Pure','Interpret complex numbers as points and vectors in the complex plane.','z=x+iy corresponds to (x,y); |z−w| is the distance between their points.','The horizontal axis represents the real part, not the modulus.'],
['roots-coeff','Roots and coefficients','2026-10-12','Core Pure','Use relationships between roots of quadratic and cubic polynomials.','For x³+ax²+bx+c with roots α,β,γ: α+β+γ=−a, αβ+βγ+γα=b and αβγ=−c.','For product of three roots, watch the negative sign on the constant.'],
['roots-complex','Complex roots of polynomials','2026-10-19','Core Pure','Apply the complex conjugate root theorem and factor real polynomials.','If a polynomial has real coefficients and u+vi is a root, then u−vi is also a root. Their quadratic factor is x²−2ux+(u²+v²).','This conjugate property requires real polynomial coefficients.'],
['seq-sum','Summing series','2026-11-02','Core Pure','Find sums using standard formulae, telescoping and algebraic rearrangement.','Σk=n(n+1)/2 and Σk²=n(n+1)(2n+1)/6. Look for partial fractions to telescope.','Check the first and last terms remaining after cancellation.'],
['seq-induct','Proof by induction','2026-11-09','Core Pure','Build rigorous base, assumption and induction steps.','Prove P(1), assume P(k), then derive P(k+1) without assuming it. State the final inductive conclusion.','A worked example is not an induction proof.'],
['cx-modarg','Modulus and argument','2026-11-16','Core Pure','Convert between Cartesian and modulus-argument representations.','|a+bi|=√(a²+b²). Argument depends on the quadrant; use the actual angle, not just arctan(b/a).','Consider negative real parts when identifying the correct quadrant.'],
['cx-loci','Loci in the complex plane','2026-11-16','Core Pure','Recognise circles, perpendicular bisectors and other complex loci.','|z−a|=r is a circle, while |z−a|=|z−b| is the perpendicular bisector of segment ab.','Write each complex constant as its (real, imaginary) coordinate.'],
['binary','Binary operations','2026-11-23','Discrete & Statistics','Investigate closure, identities, inverses, associativity and commutativity.','For an operation *, solve a*e=a for the identity and a*b=e for the inverse. Test associativity with (a*b)*c and a*(b*c).','Do not confuse commutativity with associativity.'],
['graph-intro','Graphs and networks: definitions','2026-11-23','Discrete & Statistics','Work with degrees, cycles, paths, connected graphs and graph models.','The sum of all vertex degrees equals twice the number of edges. For a connected tree, E=V−1.','A graph with two odd-degree vertices has an Euler trail, not an Euler circuit.'],
['graph-mst','Minimum spanning trees','2026-11-30','Discrete & Statistics','Apply Prim and Kruskal methods to weighted graphs.','Choose the smallest safe edges, never making a cycle; stop at V−1 edges.','Do not just choose the V−1 lightest edges without checking cycles.'],
['graph-tsp','Travelling salesperson','2026-11-30','Discrete & Statistics','Use lower bounds and tour constructions for TSP.','Nearest neighbour gives a tour (upper bound); deleting a vertex and finding an MST plus two cheapest incident links yields a lower bound.','A nearest-neighbour tour is not necessarily optimal.'],
['net-route','Route inspection','2026-12-07','Discrete & Statistics','Find shortest closed inspection routes by pairing odd vertices.','A closed route must have even degree at each vertex; pair the odd vertices with minimum added path cost.','Count repeated edges in the route length.'],
['net-flow','Network flows','2026-12-07','Discrete & Statistics','Use capacities, flow conservation and cut bounds.','At each intermediate vertex, incoming flow equals outgoing flow. Maximum flow cannot exceed any s–t cut capacity.','Check all capacity and conservation constraints, not just the sink.'],
['critical','Critical path analysis','2026-12-14','Discrete & Statistics','Calculate earliest and latest event times and identify critical activities.','Forward pass: earliest finish=max predecessor finish plus duration. Backward pass: latest start=min successor start minus duration.','Zero total float means an activity is critical.'],
['vec-dot','Vectors: scalar product','2027-01-04','Core Pure','Calculate dot products, angles and perpendicularity in 3D.','a·b=a₁b₁+a₂b₂+a₃b₃=|a||b|cosθ. Perpendicular vectors have dot product zero.','Use all three coordinates.'],
['vec-line','Equations of lines in 3D','2027-01-04','Core Pure','Write and analyse vector equations of lines.','A line is r=a+λd; rearrange component equations to find intersections or assess parallel directions.','Skew lines need not intersect even when their projections do.'],
['rat-graph','Graphs of rational functions','2027-01-11','Core Pure','Locate asymptotes, intercepts, and excluded values.','Vertical asymptotes arise from uncancelled zeros of the denominator. Horizontal asymptotes follow leading-degree ratios.','A cancelled factor may produce a hole rather than an asymptote.'],
['rat-ineq','Rational inequalities','2027-01-11','Core Pure','Solve rational inequalities using sign charts.','Move everything to one fraction, find numerator/denominator roots, then test intervals.','Never multiply an inequality by an expression of unknown sign.'],
['lp','Linear programming','2027-01-18','Discrete & Statistics','Formulate linear constraints and optimise at feasible vertices.','For a bounded feasible polygon, a linear objective reaches an optimum at a vertex.','Check every feasible corner, including axis boundaries.'],

const byId=id=>TOPICS.find(t=>t.id===id);const TODAY_TOPICS=()=>TOPICS.filter(t=>t.date<=TODAY);const unlocked=t=>t.date<=TODAY;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const niceDate=s=>new Date(`${s}T12:00:00Z`).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const fmt=n=>{if(typeof n==='string')return n;if(!Number.isFinite(n))return String(n);let r=Math.round(n*1e8)/1e8;return String(r)};
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b)[a,b]=[b,a%b];return a||1}
function fract(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return `${n/g}/${d/g}`.replace(/\/1$/,'')}
function h(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function rng(seed){let t=seed>>>0;return ()=>{t+=0x6D2B79F5;let z=t;z=Math.imul(z^(z>>>15),z|1);z^=z+Math.imul(z^(z>>>7),z|61);return ((z^(z>>>14))>>>0)/4294967296}}
function vars(seed){const r=rng(seed);const n=(a,b)=>Math.floor(r()*(b-a+1))+a;const choose=xs=>xs[n(0,xs.length-1)];const nz=(a=1,b=7)=>{let v;do{v=n(-b,b)}while(Math.abs(v)<a);return v};const shuffle=xs=>[...xs].sort(()=>r()-.5);return {r,n,choose,nz,shuffle}}
const BANK=[];function add(topic,code,label,make,level=3){BANK.push({topic,code,label,make,level,key:`${topic}:${code}`})}
const num=(prompt,correct,steps,hint,extra={})=>({type:'number',prompt,correct,steps:Array.isArray(steps)?steps:[steps],hint, ...extra});
const pair=(prompt,correct,steps,hint,extra={})=>({type:'pair',prompt,correct,steps:Array.isArray(steps)?steps:[steps],hint,...extra});
const trip=(prompt,correct,steps,hint,extra={})=>({type:'triple',prompt,correct,steps:Array.isArray(steps)?steps:[steps],hint,...extra});
const mat=(prompt,correct,steps,hint,extra={})=>({type:'matrix2',prompt,correct,steps:Array.isArray(steps)?steps:[steps],hint,...extra});
const choice=(prompt,options,correct,steps,hint,extra={})=>({type:'choice',prompt,options,correct,steps:Array.isArray(steps)?steps:[steps],hint,...extra});
const mx=(a,b,c,d)=>`<span class="math">[ ${a} &nbsp; ${b} ; &nbsp; ${c} &nbsp; ${d} ]</span>`;
const ztxt=(a,b)=>`${a}${b<0?' − ':' + '}${Math.abs(b)}i`;
const fracHTML=(a,b)=>`<span class="math">(${a})/(${b})</span>`;
const cleanSteps=xs=>xs.map(s=>String(s));

add('mat-ops','commutator','Non-commuting products',({nz,n})=>{const [a,b,c,d,e,f,g,k]=Array.from({length:8},()=>nz(1,5));const ab12=a*f+b*k,ba12=e*b+f*d;const val=2*ab12-3*ba12;return num(`Let A = ${mx(a,b,c,d)} and B = ${mx(e,f,g,k)}. Find the entry in row 1, column 2 of <span class="math">2AB − 3BA</span>.`,val,[`(AB)₁₂ = ${a}×${f} + ${b}×${k} = ${ab12}.`,`(BA)₁₂ = ${e}×${b} + ${f}×${d} = ${ba12}.`,`Hence 2(AB)₁₂ − 3(BA)₁₂ = 2(${ab12}) − 3(${ba12}) = ${val}.`],'Multiply each row by the required column, keeping the order AB and BA distinct.')});
add('mat-ops','poly','Matrix polynomial',({nz,n})=>{const [a,b,c,d]=Array.from({length:4},()=>nz(1,5));const k=n(2,4),val=a*b+b*d-k*b;return num(`For A = ${mx(a,b,c,d)}, find the (1,2) entry of <span class="math">A<sup>2</sup> − ${k}A + 2I</span>.`,val,[`(A²)₁₂ = ${a}×${b} + ${b}×${d} = ${a*b+b*d}.`,`(${k}A)₁₂ = ${k}×${b} = ${k*b}; (2I)₁₂ = 0.`,`Answer = ${val}.`],'The identity matrix contributes zero to off-diagonal entries.')});
add('mat-ops','detproduct','Determinant of product',({nz,n})=>{let a,b,c,d,e,f,g,k,da,db;do{[a,b,c,d,e,f,g,k]=Array.from({length:8},()=>nz(1,5));da=a*d-b*c;db=e*k-f*g}while(!da||!db);return num(`A = ${mx(a,b,c,d)} and B = ${mx(e,f,g,k)}. Without multiplying the matrices, calculate <span class="math">det(3AB)</span>.`,9*da*db,[`For a 2×2 matrix, det(3AB)=3² det(A) det(B).`,`det(A)=${a}×${d}−(${b}×${c})=${da}; det(B)=${e}×${k}−(${f}×${g})=${db}.`,`9×${da}×${db} = ${9*da*db}.`],'For a 2×2 matrix, scaling every entry by 3 scales the determinant by 9.')});
add('mat-ops','matrixeq','Solve a matrix equation',({nz,n})=>{const a=nz(1,5),b=nz(1,5),c=nz(1,5),d=nz(1,5),k=n(2,5),x=nz(1,6);const rhs=k*x+b;return num(`The matrix equation <span class="math">${k}X + B = C</span> holds, where the (2,1) entry of B is ${b} and the (2,1) entry of C is ${rhs}. Find the (2,1) entry of X.`,x,[`Compare entries: ${k}x + (${b}) = ${rhs}.`,`Rearrange to get ${k}x = ${rhs-b}.`,`Therefore x=${x}.`],'Matrix equations can be solved entry by entry.')});
add('mat-trans','transform','Successive transformations',({nz,n})=>{const [a,b,c,d,e,f,g,k]=Array.from({length:8},()=>nz(1,3)),x=nz(1,4),y=nz(1,4);const u=a*x+b*y,v=c*x+d*y;return pair(`The point P(${x}, ${y}) is transformed first by A = ${mx(a,b,c,d)}, then by B = ${mx(e,f,g,k)}. Find the coordinates of its final image.`,[e*u+f*v,g*u+k*v],[`Apply A first: AP = (${a}×${x}+${b}×${y}, ${c}×${x}+${d}×${y}) = (${u},${v}).`,`Then B(AP)=(${e}×${u}+${f}×${v}, ${g}×${u}+${k}×${v}) = (${e*u+f*v}, ${g*u+k*v}).`],'Write BAP, not ABP.')});
add('mat-trans','compose','Combined matrix',({nz})=>{const [a,b,c,d,e,f,g,k]=Array.from({length:8},()=>nz(1,4));return num(`Transformation A = ${mx(a,b,c,d)} is followed by B = ${mx(e,f,g,k)}. Find the (2,1) entry of the combined transformation matrix.`,g*a+k*c,[`The combined matrix is BA because A acts first.`,`(BA)₂₁ = ${g}×${a} + ${k}×${c} = ${g*a+k*c}.`],'Composition order reads right to left.')});
add('mat-trans','area','Area scale factor',({nz})=>{let a,b,c,d,det;do{[a,b,c,d]=Array.from({length:4},()=>nz(1,5));det=a*d-b*c}while(!det);const area=Math.abs(det)*6;return num(`A plane region has area 6 square units. It is transformed by A = ${mx(a,b,c,d)}. What is the area of its image?`,area,[`det(A) = ${a}×${d} − ${b}×${c} = ${det}.`,`The area scale factor is |det(A)| = ${Math.abs(det)}.`,`Image area = 6×${Math.abs(det)} = ${area}.`],'The area scale factor is the absolute value of the determinant.')});
add('mat-invline','slope','An invariant line',({n,nz})=>{const p=n(-4,3),q=n(-3,4);const lam=nz(2,6);const a=lam-2*q,b=q,c=(lam-p)*2,d=p;return num(`Find the gradient of the invariant line <span class="math">y = mx</span> for the transformation A = ${mx(a,b,c,d)}. You are told that the invariant direction has the form (1,2), and corresponds to eigenvalue ${lam}. Enter m.`,2,[`An invariant line through the origin has a direction vector v with Av=λv.`,`A(1,2) = (${a}+2×${b}, ${c}+2×${d}) = (${lam}, ${2*lam}).`,`The resulting vector is a multiple of (1,2), whose gradient is 2.`],'An eigenvector gives the direction of an invariant line. Here the direction vector is supplied.')});
add('mat-invline','eigendiag','Eigen-direction of a triangular matrix',({n,nz})=>{const lam=nz(2,6),mu=lam+n(1,4),b=nz(1,5);const m=(mu-lam)/b;return num(`The matrix A = ${mx(lam,b,0,mu)} has an invariant line through the origin that is NOT the x-axis. Find its gradient m in the equation <span class="math">y=mx</span>.`,m,[`Let the direction be (1,m). Invariance means A(1,m)=k(1,m).`,`The second component gives ${mu}m=km. For a nonzero m, k=${mu}.`,`First component: ${lam}+(${b})m=${mu}, hence m=(${mu}-${lam})/(${b})=${fmt(m)}.`],'Set A(1,m)=λ(1,m) and use the second row to identify λ.')});
add('mat-invline','fixed','Fixed points',({n,nz})=>{const k=nz(2,6),a=nz(1,5);return choice(`For A = ${mx(1,a,0,k)}, which set contains <strong>all fixed points</strong> under this transformation?`,['Only the origin','Every point on the x-axis','Every point on the y-axis','Every point in the plane'],1,[`For a fixed point (x,y), A(x,y)=(x+${a}y, ${k}y) must equal (x,y).`,`The first coordinate implies ${a}y=0, so y=0.`,`All (x,0) are fixed; this is the x-axis.`],'Solve Av=v rather than only checking that a line maps to itself.')});
add('mat-det','det3','3×3 determinant',({n,nz})=>{const a=nz(1,5),b=nz(1,5),c=nz(1,5),d=nz(1,5),e=nz(1,5),f=nz(1,5);const det=a*c*f;return num(`Find the determinant of the upper triangular matrix <span class="math">[ ${a} ${b} ${d} ; 0 ${c} ${e} ; 0 0 ${f} ]</span>.`,det,[`The determinant of a triangular matrix equals the product of its diagonal entries.`,`det = ${a}×${c}×${f} = ${det}.`],'For triangular matrices, ignore the off-diagonal entries when finding the determinant.')});
add('mat-det','inverse','An entry of the inverse',({n,nz})=>{let a,b,c,d,det;do{[a,b,c,d]=Array.from({length:4},()=>nz(1,5));det=a*d-b*c}while(!det);return num(`Let A = ${mx(a,b,c,d)}. Find the entry in row 1, column 2 of <span class="math">A<sup>−1</sup></span>.`, -b/det,[`det(A) = (${a})(${d})−(${b})(${c})=${det}.`,`A⁻¹ = (1/${det})[ ${d} ${-b} ; ${-c} ${a} ].`,`The required entry is (${ -b })/(${det}) = ${fract(-b,det)}.`],'Swap the diagonal entries and negate the off-diagonal entries.')});
add('mat-det','cramer','Solve simultaneous equations',({n,nz})=>{let a,b,c,d,det;do{[a,b,c,d]=Array.from({length:4},()=>nz(1,5));det=a*d-b*c}while(!det);const x=nz(1,6),y=nz(1,6),u=a*x+b*y,v=c*x+d*y;return pair(`Solve the simultaneous equations <span class="math">${a}x ${b>=0?'+':''}${b}y = ${u}</span> and <span class="math">${c}x ${d>=0?'+':''}${d}y = ${v}</span>. Enter x, y.`,[x,y],[`The coefficient matrix is ${mx(a,b,c,d)}; its determinant is ${det}, so the solution is unique.`,`Eliminate one variable or apply A⁻¹ to (${u},${v}).`,`The solution is x=${x}, y=${y}.`],'Use elimination or inverse matrices. Both equations must hold.')});
add('cx-basics','multiply','Products of complex numbers',({nz})=>{const [a,b,c,d]=Array.from({length:4},()=>nz(1,6));return pair(`Write <span class="math">(${ztxt(a,b)})(${ztxt(c,d)})</span> in the form x+iy. Enter x, y.`,[a*c-b*d,a*d+b*c],[`Multiply out: ac + adi + bci + bd i².`,`Since i²=−1, the real part is ${a}×${c}−${b}×${d}=${a*c-b*d}.`,`The imaginary part is ${a}×${d}+${b}×${c}=${a*d+b*c}.`],'Use FOIL, then replace i² with −1.')});
add('cx-basics','division','Rationalise a complex denominator',({nz,n})=>{const [a,b]=Array.from({length:2},()=>nz(1,6)),c=nz(1,4),d=nz(1,4);const den=c*c+d*d;return pair(`Express <span class="math">(${ztxt(a,b)})/(${ztxt(c,d)})</span> as x+iy. Enter x, y (fractions allowed).`,[(a*c+b*d)/den,(b*c-a*d)/den],[`Multiply top and bottom by the conjugate ${ztxt(c,-d)}.`,`The denominator becomes ${c}²+${d}²=${den}.`,`Real part = (${a}×${c}+${b}×${d})/${den}=${fract(a*c+b*d,den)}.`,`Imaginary part = (${b}×${c}−${a}×${d})/${den}=${fract(b*c-a*d,den)}.`],'Multiply numerator and denominator by the conjugate of the denominator.')});
add('cx-basics','square','Square of a complex number',({nz,n})=>{const a=nz(1,9),b=nz(1,9),k=n(1,4);return pair(`Find the real and imaginary parts of <span class="math">(${ztxt(a,b)})² + ${k}i</span>. Enter x, y.`,[a*a-b*b,2*a*b+k],[`(a+bi)²=a²+2abi−b².`,`Real part = ${a}²−(${b})²=${a*a-b*b}.`,`Imaginary part = 2×${a}×${b}+${k}=${2*a*b+k}.`],'Expand the square; note i² = −1.')});
add('cx-basics','modsquare','Conjugates and moduli',({nz,n})=>{const a=nz(1,9),b=nz(1,9),k=n(2,4);return num(`Let <span class="math">z = ${ztxt(a,b)}</span>. Evaluate the real number <span class="math">z\u0305z + ${k}</span>.`,a*a+b*b+k,[`z times its conjugate is |z|²=a²+b².`,`Here |z|²=${a*a}+${b*b}=${a*a+b*b}.`,`Add ${k} to obtain ${a*a+b*b+k}.`],'z times its conjugate is always real.')});
add('cx-argand','distance','Distances on an Argand plane',({n,nz})=>{const a=nz(1,6),b=nz(1,6),dx=n(3,7),dy=n(3,7),c=a+dx,d=b+dy;return num(`Points P and Q represent <span class="math">z₁=${ztxt(a,b)}</span> and <span class="math">z₂=${ztxt(c,d)}</span>. Find <span class="math">|z₂−z₁|²</span>.`,dx*dx+dy*dy,[`Subtract the coordinates: z₂−z₁=(${dx})+(${dy})i.`,`The squared distance is ${dx}²+${dy}²=${dx*dx+dy*dy}.`],'The squared modulus is real² + imaginary².')});
add('cx-argand','midpoint','Midpoint of complex points',({nz,n})=>{const a=nz(1,7),b=nz(1,7),c=nz(1,7),d=nz(1,7);return pair(`On an Argand diagram, A represents <span class="math">${ztxt(a,b)}</span> and B represents <span class="math">${ztxt(c,d)}</span>. Find the complex number representing their midpoint. Enter real part, imaginary part.`,[(a+c)/2,(b+d)/2],[`The midpoint is (zA+zB)/2.`,`Real part = (${a}+${c})/2 = ${fract(a+c,2)}.`,`Imaginary part = (${b}+${d})/2 = ${fract(b+d,2)}.`],'Average the real components and imaginary components separately.')});
add('cx-argand','equidistant','Perpendicular bisector locus',({n,nz})=>{const a=nz(1,5),b=nz(1,5),p=n(2,7);const m=a+p;return num(`A point z=x+iy in the Argand plane satisfies <span class="math">|z−(${ztxt(a,b)})|=|z−(${ztxt(a+2*p,b)})|</span>. The locus is a vertical line x=k. Find k.`,a+p,[`The two fixed points have coordinates (${a},${b}) and (${a+2*p},${b}).`,`The locus is their perpendicular bisector.`,`Midpoint x-coordinate = (${a}+${a+2*p})/2 = ${m}.`],'The perpendicular bisector crosses at the midpoint of the two fixed points.')});
add('roots-coeff','cubic','Coefficients of a cubic',({nz,n})=>{const a=nz(1,7),b=nz(1,7),c=nz(1,7);const v=a*b+b*c+c*a;return num(`A monic cubic has roots <span class="math">${a}, ${b}, ${c}</span> and is written <span class="math">x³ + px² + qx + r</span>. Find q.`,v,[`By Vieta, q is the sum of the pairwise products of the roots.`,`q=(${a})(${b})+(${b})(${c})+(${c})(${a})=${v}.`],'For a monic cubic, the coefficient of x is the sum of pairwise root products.')});
add('roots-coeff','recip','Reciprocal roots',({nz})=>{let a,b,c;do{[a,b,c]=Array.from({length:3},()=>nz(1,6))}while(a*b*c===0);const v=1/a+1/b+1/c;return num(`A cubic has non-zero roots ${a}, ${b}, ${c}. Find the sum of the reciprocals of its roots.`,v,[`The sum is 1/${a} + 1/${b} + 1/${c}.`,`Over a common denominator it becomes (${a*b+b*c+c*a})/(${a*b*c}) = ${fract(a*b+b*c+c*a,a*b*c)}.`],'Use (αβ+βγ+γα)/(αβγ).')});
add('roots-coeff','missing','Missing root from coefficient',({nz,n})=>{const a=nz(1,8),b=nz(1,8),c=nz(1,8),coef=-(a+b+c);return num(`The polynomial <span class="math">x³ ${coef>=0?'+':''}${coef}x² + px + q</span> has roots ${a}, ${b} and a third root r. Find r.`,c,[`For a monic cubic, the sum of roots is minus the coefficient of x².`,`Thus ${a}+(${b})+r=${-coef}.`,`Rearranging gives r=${c}.`],'Apply Vieta’s sum-of-roots relationship.')});
add('roots-complex','third','Conjugate roots and remaining root',({nz,n})=>{const a=nz(1,5),b=n(1,7),c=nz(1,8),p=-(2*a+c);return num(`A real-coefficient monic cubic <span class="math">x³ ${p>=0?'+':''}${p}x² + qx + r</span> has root <span class="math">${ztxt(a,b)}</span>. Find its real third root.`,c,[`Because coefficients are real, ${ztxt(a,-b)} is also a root.`,`The sum of these two roots is ${2*a}.`,`By Vieta, ${2*a}+r=${-p}; hence r=${c}.`],'The imaginary terms of a conjugate pair cancel in their sum.')});
add('roots-complex','quad','Quadratic with complex solutions',({n,nz})=>{const a=nz(1,7),b=n(1,7);return pair(`The quadratic equation <span class="math">x² ${-2*a>=0?'+':''}${-2*a}x + ${a*a+b*b}=0</span> has two non-real roots. Enter the real and positive imaginary parts of the root in the upper half-plane.`,[a,b],[`The sum of roots is ${2*a}, so their real parts both equal ${a}.`,`The product of conjugates is a²+b²=${a*a+b*b}.`,`Hence the two roots are ${ztxt(a,b)} and ${ztxt(a,-b)}.`],'Compare with (x−a)²+b²=0.')});
add('roots-complex','factor','Quadratic conjugate factor',({n,nz})=>{const a=nz(1,7),b=n(1,7);return num(`A real polynomial has a root <span class="math">${ztxt(a,b)}</span>. Its associated monic real quadratic factor is x²+px+q. Find q.`,a*a+b*b,[`The conjugate ${ztxt(a,-b)} is also a root.`,`Their product is (a+bi)(a−bi)=a²+b²=${a*a}+${b*b}=${a*a+b*b}.`,`Therefore q=${a*a+b*b}.`],'The constant term of the quadratic factor is the product of its conjugate roots.')});
add('seq-sum','sumsquares','Combining standard sums',({n})=>{const N=n(8,24),a=n(2,6),b=n(2,6);const s1=N*(N+1)/2,s2=N*(N+1)*(2*N+1)/6,val=a*s2-b*s1;return num(`Evaluate <span class="math">∑<sub>k=1</sub><sup>${N}</sup> (${a}k² − ${b}k)</span> exactly.`,val,[`Split the sum: ${a}Σk²−${b}Σk.`,`Σk² = ${N}(${N}+1)(2×${N}+1)/6 = ${s2}. Σk = ${N}(${N}+1)/2 = ${s1}.`,`The result is ${a}×${s2}−${b}×${s1}=${val}.`],'Use both Σk and Σk² formulas.')});
add('seq-sum','telescoping','Telescoping fractions',({n})=>{const N=n(5,28),a=n(1,5);const val=a*N/(N+1);return num(`Find <span class="math">∑<sub>k=1</sub><sup>${N}</sup> ${a}/[k(k+1)]</span> as a fraction.`,val,[`Use 1/[k(k+1)] = 1/k − 1/(k+1).`,`After cancellation, the sum is ${a}(1−1/${N+1}).`,`This is ${a}×${N}/${N+1} = ${fract(a*N,N+1)}.`],'Use partial fractions to cancel consecutive terms.')});
add('seq-sum','geometric','Finite geometric series',({n})=>{const r=n(2,4),N=n(5,9),a=n(1,5);return num(`Find the exact sum <span class="math">${a} + ${a*r} + ${a*r*r} + ⋯ + ${a}×${r}<sup>${N-1}</sup></span> (${N} terms).`,a*(r**N-1)/(r-1),[`This is a geometric series with first term ${a}, ratio ${r}, and ${N} terms.`,`Sₙ=a(rⁿ−1)/(r−1).`,`S=${a}(${r}^${N}−1)/(${r}−1) = ${a*(r**N-1)/(r-1)}.`],'Use the finite geometric series formula, not the infinite one.')});
add('seq-induct','gap','Inductive proof: identify the step',({n})=>{const k=n(2,12);return choice(`You are proving <span class="math">1² + 2² + ⋯ + n² = n(n+1)(2n+1)/6</span> by induction. Assuming it holds for n=k, which expression must be shown equal to the (k+1) result?`,[`k(k+1)(2k+1)/6 + (k+1)²`,`k(k+1)(2k+1)/6 + k²`,`k(k+1)(2k+1)/6 × (k+1)²`,`(k+1)(k+2)(2k+3)/6 − k²`],0,[`Start from the sum ending at k and add the new final term (k+1)².`,`The inductive hypothesis gives k(k+1)(2k+1)/6 for the sum to k.`,`Therefore use the first displayed expression and algebraically simplify it to (k+1)(k+2)(2k+3)/6.`],'From P(k) to P(k+1), add the next term of the series.')});
add('seq-induct','divisibility','Divisibility induction',({n})=>{const k=n(2,12);return choice(`You want to prove <span class="math">${3}ⁿ − 1</span> is divisible by 2 for all positive integers n. Which step correctly uses the induction hypothesis for n=k?`,['3^(k+1)−1 = 3(3^k−1)+2','3^(k+1)−1 = (3^k−1)+2','3^(k+1)−1 = 3(3^k−1)+1','3^(k+1)−1 = (3^k−1)−2'],0,[`Rewrite 3^(k+1)−1 = 3×3^k−1.`,`Add and subtract 3 to obtain 3(3^k−1)+2.`,`If 3^k−1 is divisible by 2, then so is 3(3^k−1)+2.`],'Rewrite the next term as a multiple of the inductive expression plus a multiple of 2.')});
add('cx-modarg','quadrant','Principal argument',({n})=>{const k=n(2,9),q=n(0,3);const pairs=[[-k,k],[k,-k],[-k,-k],[k,k]],angles=['3π/4','−π/4','−3π/4','π/4'];const [a,b]=pairs[q];return choice(`Find the principal argument of <span class="math">z=${ztxt(a,b)}</span>, where <span class="math">−π < arg(z) ≤ π</span>.`,angles,q,[`The point (${a},${b}) lies in quadrant ${['II','IV','III','I'][q]}.`,`The real and imaginary parts have equal absolute magnitude, giving reference angle π/4.`,`The principal argument is ${angles[q]}.`],'Sketch the point first. arctan(b/a) alone may give the wrong quadrant.')});
add('cx-modarg','modulus','Complex modulus',({n})=>{const k=n(2,8),a=3*k,b=4*k;return num(`For <span class="math">z=${ztxt(a,-b)}</span>, calculate <span class="math">|2z|</span>.`,10*k,[`|z|=√(${a}²+${b}²)=√(${25*k*k})=${5*k}.`,`|2z|=2|z|=${10*k}.`],'Use the 3–4–5 triangle and the multiplicative property of modulus.')});
add('cx-loci','circle','Equation of a complex circle',({n,nz})=>{const a=nz(1,7),b=nz(1,7),r=n(2,9);return num(`The locus <span class="math">|z−(${ztxt(a,b)})|=${r}</span> is a circle. Find its y-coordinate at the centre.`,b,[`Write the locus as distance from z to the complex point ${ztxt(a,b)}.`,`The circle has centre (${a},${b}) and radius ${r}.`,`Therefore its centre's y-coordinate is ${b}.`],'The complex number subtracted from z identifies the centre.')});
add('cx-loci','bisect','Complex perpendicular bisector',({n,nz})=>{const a=nz(1,7),b=nz(1,7),d=n(2,8);const ys=b+d;return num(`The locus <span class="math">|z−(${ztxt(a,b)})|=|z−(${ztxt(a,b+2*d)})|</span> is a horizontal line y=k. Find k.`,ys,[`The fixed points share x-coordinate ${a} and have y-coordinates ${b} and ${b+2*d}.`,`Equidistant points lie on their perpendicular bisector.`,`The midpoint is y=(${b}+${b+2*d})/2=${ys}.`],'Equal distances from two points imply a perpendicular bisector.')});
add('binary','identity','Identity in a binary operation',({n,nz})=>{const k=nz(1,9);return num(`A binary operation is defined on the real numbers by <span class="math">a ∗ b = a + b + ${k}</span>. Find its identity element e.`, -k,[`An identity e satisfies a∗e=a for every a.`,`a+e+(${k})=a.`,`Hence e=${-k}.`],'Set a∗e equal to a and solve for e.')});
add('binary','inverse','Inverse element',({n,nz})=>{const k=nz(1,7),a=nz(1,8);return num(`For the operation <span class="math">a ∗ b = a+b+(${k})</span>, find the inverse of the element a=${a}.`, -2*k-a,[`The identity is e=${-k} since a∗e=a.`,`Let b be the inverse of ${a}; then ${a}+b+(${k})=${-k}.`,`So b=${-2*k-a}.`],'First find the identity, then solve a∗b=e.')});
add('graph-intro','handshake','Degree sum theorem',({n})=>{const V=n(9,22),odd=n(2,6)*2,extra=n(5,19);const E=V-1+extra;return num(`A connected simple graph has ${V} vertices and ${E} edges. What is the sum of all vertex degrees?`,2*E,[`By the handshaking lemma, the sum of vertex degrees equals 2E.`,`Here E=${E}, so the degree sum is ${2*E}.`],'Each edge contributes one to the degree of each of its endpoints.')});
add('graph-intro','tree','Number of edges in a tree',({n})=>{const V=n(12,40);return num(`A connected graph contains no cycles and has ${V} vertices. How many edges does it have?`,V-1,[`A connected acyclic graph is a tree.`,`A tree has E=V−1 edges.`,`E=${V}−1=${V-1}.`],'A tree is connected and has no cycles.')});
add('graph-mst','kruskal','Kruskal edge weights',({n})=>{const a=n(1,4),b=a+n(1,3),c=b+n(1,3),d=c+n(1,3),e=d+n(1,3);return num(`The graph has vertices A,B,C,D and edges AB=${a}, AC=${b}, BC=${c}, BD=${d}, CD=${e}. Find the weight of its minimum spanning tree.`,a+b+d,[`Select AB (${a}) and AC (${b}), the two smallest safe edges.`,`BC (${c}) forms a cycle and must be skipped.`,`Select BD (${d}) to connect D. Total=${a}+${b}+${d}=${a+b+d}.`],'Use Kruskal: choose smallest edges that do not create a cycle.')});
add('graph-mst','prim','MST with five vertices',({n})=>{const a=n(1,4),b=a+n(1,3),c=b+n(1,3),d=c+n(1,3),e=d+n(1,3);return num(`A weighted network has edges AB=${a}, BC=${b}, CD=${c}, DE=${d}, AC=${e}, BD=${e+2}, CE=${e+3}, AE=${e+5}. Find its minimum spanning tree weight.`,a+b+c+d,[`The four edges AB, BC, CD and DE link all five vertices without a cycle.`,`The remaining edges are strictly more expensive than the path edges they could replace.`,`MST total=${a}+${b}+${c}+${d}=${a+b+c+d}.`],'Use the cheapest links joining new components, then check there are V−1 edges.')});
add('graph-tsp','nearest','Nearest neighbour tour',({n})=>{const a=n(2,6),b=a+n(1,3),c=b+n(1,4),d=c+n(1,3),e=d+n(1,3),f=e+n(1,4);return num(`For the complete graph on A,B,C,D, edge weights are AB=${a}, AC=${b}, AD=${f}, BC=${c}, BD=${d}, CD=${e}. Using nearest-neighbour starting at A, find the full tour length.`,a+c+e+f,[`From A choose B (cost ${a}).`,`From B choose C (cost ${c}, cheaper than BD=${d}).`,`From C go to D (cost ${e}), then return D→A (${f}).`,`Tour length=${a}+${c}+${e}+${f}=${a+c+e+f}.`],'Remember to return to the starting vertex.')});
add('graph-tsp','lower','TSP lower bound',({n})=>{const a=n(2,6),b=a+n(1,4),c=b+n(1,4),d=c+n(1,4);return num(`To find a travelling-salesperson lower bound, vertex A is removed. The remaining vertices have an MST of weight ${d}. The two cheapest edges incident to A have weights ${a} and ${b}. Find the lower bound.`,a+b+d,[`Deleting A leaves an MST of weight ${d}.`,`Any tour needs two edges incident to A; the two cheapest cost at least ${a}+${b}.`,`Lower bound=${d}+${a}+${b}=${a+b+d}.`],'Use the MST after deleting the vertex, then add the cheapest two incident links.')});
add('net-route','oddpair','Pairing four odd vertices',({n})=>{const a=n(3,7),b=n(3,7),c=n(3,7),p=n(1,4),base=n(15,45);const costs=[a+b,a+b+p,a+b+p+2];return num(`A route inspection network has total edge length ${base}. Its four odd vertices A,B,C,D can be paired with total shortest-path lengths: (AB,CD)=${costs[0]}, (AC,BD)=${costs[1]}, (AD,BC)=${costs[2]}. What is the shortest closed inspection route length?`,base+costs[0],[`A closed route requires duplicating paths to pair all odd vertices.`,`The cheapest pairing is AB with CD, costing ${costs[0]}.`,`Add to original total: ${base}+${costs[0]}=${base+costs[0]}.`],'Match odd vertices in pairs with least total duplicated distance.')});
add('net-route','twoodd','Two odd vertices',({n})=>{const base=n(29,79),repeat=n(5,19);return num(`A connected weighted network has exactly two odd-degree vertices, with shortest connecting path length ${repeat}. The sum of all edge weights is ${base}. Find the minimum length of a closed route inspecting every edge.`,base+repeat,[`For a closed route, the two odd vertices must be made even by repeating their shortest connecting path.`,`Required duplicate distance is ${repeat}.`,`Total route length=${base}+${repeat}=${base+repeat}.`],'A closed route cannot start and finish at the same vertex with odd-degree vertices unless some edges are repeated.')});
add('net-flow','cut','Cut capacity',({n})=>{const a=n(3,10),b=n(3,10),c=n(3,10);return num(`In a capacitated directed network, one s–t cut has three forward arcs with capacities ${a}, ${b} and ${c}, and one backward arc of capacity ${n(4,10)}. What is the capacity of this cut?`,a+b+c,[`Only forward arcs crossing the cut count toward its capacity.`,`Cut capacity=${a}+${b}+${c}=${a+b+c}.`,`Do not include the backward arc.`],'A directed cut counts arcs going from the source side to the sink side.')});
add('net-flow','conserve','Conservation at a vertex',({n})=>{const a=n(7,16),b=n(4,12),c=n(3,8),d=a+b-c;return num(`At an intermediate vertex, incoming flows are ${a} and ${b}. Outgoing flows are ${c} and x. Find x.`,d,[`Conservation of flow gives total incoming = total outgoing.`,`So ${a}+${b}=${c}+x.`,`x=${a+b}−${c}=${d}.`],'For a vertex that is neither source nor sink, incoming = outgoing.')});
add('critical','criticalpath','Critical path duration',({n})=>{const A=n(3,8),B=n(4,8),C=n(3,7),D=n(2,9);return num(`In an activity network, activity C (duration ${C}) can start only after A (duration ${A}) and B (duration ${B}) are complete. Activity D (duration ${D}) follows C. A and B start at time 0. Find the earliest finish time of D.`,Math.max(A,B)+C+D,[`C must wait until both A and B have finished: earliest start=max(${A},${B})=${Math.max(A,B)}.`,`Earliest finish of C=${Math.max(A,B)}+${C}=${Math.max(A,B)+C}.`,`Earliest finish of D=${Math.max(A,B)+C}+${D}=${Math.max(A,B)+C+D}.`],'At a merge point, take the maximum incoming earliest finish.')});
add('critical','float','Total float',({n})=>{const earliest=n(4,13),duration=n(3,9),slack=n(1,9),latest=earliest+duration+slack;return num(`An activity has earliest start ${earliest}, duration ${duration}, and latest finish ${latest}. Find its total float.`,slack,[`Total float = latest finish − earliest start − duration.`,`= ${latest}−${earliest}−${duration}=${slack}.`],'Activity float is time available without delaying the project.')});
add('vec-dot','dot','Scalar product in 3D',({nz})=>{const a=Array.from({length:6},()=>nz(1,7));const val=a[0]*a[3]+a[1]*a[4]+a[2]*a[5];return num(`Find the scalar product of <span class="math">a=(${a[0]},${a[1]},${a[2]})</span> and <span class="math">b=(${a[3]},${a[4]},${a[5]})</span>.`,val,[`Multiply matching components and sum.`,`a·b=(${a[0]})(${a[3]})+(${a[1]})(${a[4]})+(${a[2]})(${a[5]})=${val}.`],'Use the component formula a·b=a₁b₁+a₂b₂+a₃b₃.')});
add('vec-dot','perp','Parameter for perpendicular vectors',({nz,n})=>{const a=nz(1,6),b=nz(1,6),c=nz(1,6),d=nz(1,6),e=nz(1,6),f=nz(1,6),k=-(a*d+b*e)/c;return num(`Vectors <span class="math">u=(${a},${b},${c})</span> and <span class="math">v=(${d},${e},t)</span> are perpendicular. Find t.`,k,[`Perpendicular vectors have dot product zero.`,`(${a})(${d})+(${b})(${e})+(${c})t=0.`,`Hence t=−(${a*d+b*e})/(${c})=${fract(-(a*d+b*e),c)}.`],'Set u·v=0 and solve the linear equation.')});
add('vec-line','pointonline','Point on a line',({n,nz})=>{const a=Array.from({length:6},()=>nz(1,5)),t=nz(2,5);return trip(`A line is <span class="math">r=(${a[0]},${a[1]},${a[2]})+λ(${a[3]},${a[4]},${a[5]})</span>. Find the coordinates of the point where λ=${t}.`,[a[0]+t*a[3],a[1]+t*a[4],a[2]+t*a[5]],[`Substitute λ=${t} into all three components.`,`r=(${a[0]}+${t}×${a[3]}, ${a[1]}+${t}×${a[4]}, ${a[2]}+${t}×${a[5]}).`,`Therefore r=(${a[0]+t*a[3]}, ${a[1]+t*a[4]}, ${a[2]+t*a[5]}).`],'Add the position vector to λ times the direction vector.')});
add('vec-line','intersection','Intersection parameter',({n,nz})=>{const a=nz(1,8),b=nz(1,8),p=nz(1,5),q=nz(1,5),k=nz(2,6);return num(`Lines L₁ and L₂ have x-coordinates <span class="math">x=${a}+${p}λ</span> and <span class="math">x=${a+p*k}+${q}μ</span>. You are told the lines intersect when μ=0. Find λ at their intersection.`,k,[`At μ=0, L₂ has x-coordinate ${a+p*k}.`,`Equate x: ${a}+(${p})λ=${a+p*k}.`,`Solve to get λ=${k}.`],'Use the supplied μ value, then equate corresponding components.')});
add('rat-graph','asymptotes','Vertical asymptote',({n,nz})=>{const a=nz(1,8),b=nz(1,9);return num(`For <span class="math">f(x)=(${b}x+1)/(x−(${a}))</span>, find the x-coordinate of its vertical asymptote.`,a,[`A vertical asymptote occurs when the denominator is zero and the numerator does not cancel.`,`x−(${a})=0, so x=${a}.`],'Set the uncancelled denominator equal to zero.')});
add('rat-graph','horizontal','Horizontal asymptote',({n,nz})=>{const a=nz(1,8),b=nz(1,8),c=nz(1,8),d=nz(1,8);return num(`Find the horizontal asymptote y=k of <span class="math">f(x)=(${a}x+${b})/(${c}x+${d})</span>. Enter k.`,a/c,[`The numerator and denominator both have degree 1.`,`Their leading coefficient ratio gives k=${a}/${c}=${fract(a,c)}.`],'For equal degrees, divide the leading coefficients.')});
add('rat-ineq','interval','Rational sign chart',({n})=>{const a=n(-6,-1),b=n(1,6);return choice(`Solve <span class="math">(x−(${a}))/(x−(${b})) > 0</span>. Which solution set is correct?`,[`x < ${a} or x > ${b}`,`${a} < x < ${b}`,`x ≤ ${a} or x ≥ ${b}`,`x > ${a}`],0,[`Critical values are ${a} (numerator zero) and ${b} (denominator zero).`,`The signs agree outside the two critical points.`,`Strict inequality excludes both endpoints: x<${a} or x>${b}.`],'Split the real line at numerator and denominator roots and test signs.')});
add('rat-ineq','nonnegative','Inclusive rational inequalities',({n})=>{const a=n(-7,-2),b=n(1,7);return choice(`Solve <span class="math">(x−(${a}))/(x−(${b})) ≤ 0</span>.`,[`${a} ≤ x < ${b}`,`${a} < x ≤ ${b}`,`x < ${a} or x > ${b}`,`${a} ≤ x ≤ ${b}`],0,[`Between ${a} and ${b}, the numerator is positive while the denominator is negative, so the fraction is negative.`,`At x=${a} the numerator is 0 and the expression is defined, so include ${a}.`,`At x=${b} the denominator is zero, so exclude ${b}.`],'A zero numerator may be included under ≤; a zero denominator can never be included.')});
add('lp','corners','Linear programming: optimise',({n})=>{const a=n(4,9),b=n(4,9),u=n(Math.max(a,b),a+b-1),p=n(3,7),q=n(1,2);const pts=[[0,0],[a,0],[0,b],[a,u-a],[u-b,b]].filter(([x,y])=>x>=0&&y>=0&&x<=a&&y<=b&&x+y<=u);const val=Math.max(...pts.map(([x,y])=>p*x+q*y));const winner=pts.find(([x,y])=>p*x+q*y===val);return num(`Maximise <span class="math">P=${p}x+${q}y</span> subject to <span class="math">x≥0, y≥0, x≤${a}, y≤${b}, x+y≤${u}</span>. Find the maximum value of P.`,val,[`A linear objective achieves its maximum at a feasible vertex.`,`Test the feasible corners: ${pts.map(([x,y])=>`(${x},${y}) → ${p*x+q*y}`).join('; ')}.`,`Maximum P=${val}, attained at (${winner[0]},${winner[1]}).`],'List the feasible polygon vertices and evaluate the objective at each.')});
add('lp','production','Resource constraint',({n})=>{const a=n(2,5),b=n(3,7),u=n(14,35),x=n(1,4);return num(`A factory makes products X and Y. Each unit of X uses ${a} hours and each Y uses ${b} hours, with ${u} hours available. If ${x} units of X are produced, what is the maximum whole number of units of Y possible?`,Math.floor((u-a*x)/b),[`The resource constraint is ${a}x+${b}y≤${u}.`,`With x=${x}, y≤(${u}−${a*x})/${b}=${fmt((u-a*x)/b)}.`,`As units are whole, y≤${Math.floor((u-a*x)/b)}.`],'Form the resource inequality and round down for whole units.')});
add('game','saddle','Pure-strategy game',({n})=>{const v=n(2,8),a=n(1,6),b=n(1,6);return num(`A zero-sum payoff matrix for the row player is <span class="math">[ ${v} ${v+a} ; ${v-b} ${v+a+b} ]</span>. Determine the game value if both players use optimal pure strategies.`,v,[`Row minima are min(${v},${v+a})=${v} and min(${v-b},${v+a+b})=${v-b}. The maximin is ${v}.`,`Column maxima are max(${v},${v-b})=${v} and max(${v+a},${v+a+b})=${v+a+b}. The minimax is ${v}.`,`Both equal ${v}, so there is a saddle point with game value ${v}.`],'Compare maximum row minimum with minimum column maximum.')});
add('game','maximin','Maximin without saddle',({n})=>{const a=n(3,8),b=a+n(2,5),c=a+n(1,3),d=c+n(3,6);return num(`The row-player payoff matrix is <span class="math">[ ${a} ${b} ; ${c} ${d} ]</span>. What is the row player's maximin payoff?`,c,[`Row 1 guarantees min(${a},${b})=${a}.`,`Row 2 guarantees min(${c},${d})=${c}.`,`Maximin=max(${a},${c})=${c}.`],'Take the minimum of each row, then the maximum of those minima.')});
add('conics','ellipse','Ellipse foci',({n})=>{const p=n(3,8),q=n(1,p-1);const a=p*p+q*q,b=2*p*q;return num(`An ellipse is <span class="math">x²/${a*a} + y²/${b*b} = 1</span>, where its major axis is horizontal. Find the positive x-coordinate of its focus (decimal or exact).`,Math.sqrt(a*a-b*b),[`For an ellipse with horizontal major axis, c²=a²−b².`,`c²=${a*a}−${b*b}=${a*a-b*b}.`,`The positive focus is at x=√${a*a-b*b}=${Math.sqrt(a*a-b*b)}.`],'Identify the larger denominator, then use c²=a²−b².')});
add('conics','hyperbola','Hyperbola foci',({n})=>{const a=n(2,9),b=n(2,9);return num(`The hyperbola <span class="math">x²/${a*a} − y²/${b*b} = 1</span> has foci (±c,0). Find c².`,a*a+b*b,[`For a hyperbola in this form, c²=a²+b².`,`c²=${a*a}+${b*b}=${a*a+b*b}.`],'For a hyperbola, the foci relationship contains a plus sign.')});
add('polar','circle','Circle from polar equation',({n})=>{const a=n(2,9);return num(`The polar curve <span class="math">r=${2*a} cos θ</span> represents a circle. Find the x-coordinate of the circle's centre.`,a,[`Multiply both sides by r: r²=${2*a}r cosθ.`,`Use x²+y²=r² and x=r cosθ to get x²+y²=${2*a}x.`,`Completing the square gives (x−${a})²+y²=${a*a}; centre (${a},0).`],'Use r²=x²+y² and r cosθ=x.')});
add('polar','coords','Polar to Cartesian',({n})=>{const k=n(2,12);return pair(`A point has polar coordinates <span class="math">(r,θ)=(${2*k}, π/3)</span>. Find its Cartesian coordinates (x,y), writing surds using sqrt().`,[k,k*Math.sqrt(3)],[`x=r cosθ=${2*k}×(1/2)=${k}.`,`y=r sinθ=${2*k}×(√3/2)=${k}√3.`,`Answer (${k}, ${k}sqrt(3)).`],'At π/3, cosθ=1/2 and sinθ=√3/2.')});
add('drv-mean','distribution','Discrete expectation',({n})=>{const a=n(-4,2),d=n(2,6),p=n(1,4);const prob=p/10,exp=a*(1-prob)+(a+d)*prob;return num(`A random variable X takes the value ${a} with probability ${fmt(1-prob)} and value ${a+d} with probability ${fmt(prob)}. Find E(X).`,exp,[`E(X)=ΣxP(X=x).`,`E(X)=(${a})×${fmt(1-prob)}+(${a+d})×${fmt(prob)}=${fmt(exp)}.`],'Multiply each value by its probability, then add.')});

add('crv-pdf','normalise','Normalise a probability density',({n})=>{const b=n(2,7),power=n(1,3);const k=(power+1)/b**(power+1);return num(`The PDF of X is <span class="math">f(x)=kx<sup>${power}</sup></span> for 0≤x≤${b}, and 0 elsewhere. Find k.`,k,[`A PDF must have total area 1.`,`1=∫₀^${b} k x^${power} dx = k×${b}^${power+1}/${power+1}.`,`Thus k=${power+1}/${b**(power+1)}=${fract(power+1,b**(power+1))}.`],'Integrate the PDF over its full support and set the result equal to 1.')});
add('crv-pdf','integral','Probability from a PDF',({n})=>{const b=n(3,9),a=n(1,b-1),power=n(1,3);const p=1-(a/b)**(power+1);return num(`X has PDF <span class="math">f(x)=${power+1}x<sup>${power}</sup>/${b**(power+1)}</span> for 0≤x≤${b}. Find P(X>${a}).`,p,[`P(X>${a})=∫ from ${a} to ${b} f(x)dx.`,`The integral is [x^${power+1}/${b**(power+1)}] from ${a} to ${b}.`,`Answer=1−(${a}/${b})^${power+1}=${fract(b**(power+1)-a**(power+1),b**(power+1))}.`],'Integrate from the specified lower bound to the end of the support.')});

add('crv-transform','scale','Scale a continuous random variable',({n,nz})=>{const b=n(2,9),a=n(2,6),c=nz(-4,4);return num(`X is uniformly distributed on [0, ${b}]. Define <span class="math">Y=${a}X+(${c})</span>. Find E(Y).`,a*b/2+c,[`For X~U(0,${b}), E(X)=${b}/2.`,`Linearity of expectation: E(Y)=${a}E(X)+(${c}).`,`E(Y)=${a}×${b}/2+(${c})=${fmt(a*b/2+c)}.`],'A linear transformation aX+b changes the mean to aE(X)+b.')});

add('maclaurin','expcoef','Coefficient in exponential series',({n,nz})=>{const a=nz(1,6),power=n(2,5),fac=Array.from({length:power},(_,i)=>i+1).reduce((x,y)=>x*y,1);return num(`Find the coefficient of <span class="math">x<sup>${power}</sup></span> in the Maclaurin expansion of <span class="math">e<sup>${a}x</sup></span>.`,a**power/fac,[`e^(ax)=Σ(a^k x^k)/k!.`,`The x^${power} coefficient is ${a}^${power}/${power}!.`,`= ${fract(a**power,fac)}.`],'Recall e^t=1+t+t²/2!+⋯ and put t=ax.')});

add('calc','meanvalue','Mean value of a function',({n})=>{const a=n(1,4),b=a+n(2,5),p=n(1,4),q=n(1,6);const integral=p*(b**3-a**3)/3+q*(b-a),val=integral/(b-a);return num(`Find the mean value of <span class="math">f(x)=${p}x²+${q}</span> on the interval [${a},${b}].`,val,[`Mean = 1/(${b}−${a}) × ∫ from ${a} to ${b} (${p}x²+${q}) dx.`,`Antiderivative is (${p}/3)x³+${q}x.`,`Mean = ${fract(p*(b*b+b*a+a*a),3)}+${q} = ${fmt(val)}.`],'Integrate across the interval and divide by its length.')});

// Every topic must be backed by working, marked questions.
if(TOPICS.some(t=>!BANK.some(b=>b.topic===t.id))) console.error('Question bank coverage incomplete');
// Deterministic expandable question bank: more variants for already-taught topics.
const variantsFor=t=>unlocked(t)?18:5;
function bankEntries(topicIds){const ids=new Set(topicIds);const out=[];for(const t of BANK)if(ids.has(t.topic)){const topic=byId(t.topic);for(let i=0;i<variantsFor(topic);i++)out.push({key:t.key,seed:h(`axiom:bank:v2:${t.key}:${i}`),index:i})}return out}
const allBankEntries=()=>bankEntries(TOPICS.map(t=>t.id));
const availableBank=()=>bankEntries(TODAY_TOPICS().map(t=>t.id));
const getTemplate=key=>BANK.find(t=>t.key===key);
function build(ref){const b=getTemplate(ref.key);if(!b)throw Error('Missing question template');const q=b.make(vars(ref.followupSeed??ref.seed));return {...q,topic:b.topic,label:b.label,level:b.level,templateKey:b.key,seed:ref.followupSeed??ref.seed,marks:q.marks??(q.type==='pair'||q.type==='triple'?5:4)}}
const DEFAULT={version:2,xp:0,correct:0,wrong:0,settings:{count:7,showTimer:false},daily:{},skill:{},seen:{},activity:{},mistakes:[],achievements:[],bookmarks:[],userName:''};
function load(){try{const v=JSON.parse(localStorage.getItem('axiom.fm.2026.v2'));if(!v||v.version!==2)return structuredClone(DEFAULT);return {...structuredClone(DEFAULT),...v,settings:{...DEFAULT.settings,...v.settings}}}catch(e){return structuredClone(DEFAULT)}}
let state=load();const ui={page:'dashboard',dailyIndex:0,selectedChoice:null,feedback:null,session:null,exploreUnit:'All',exploreStatus:'All',exploreQuery:'',notesTopic:TOPICS[0].id,notesQuery:'',practiceMode:'random',selectedTopic:TOPICS[0].id,notice:''};
const save=()=>{try{localStorage.setItem('axiom.fm.2026.v2',JSON.stringify(state))}catch(e){showToast('Storage is full or disabled. Try exporting your progress.')}};
function showToast(msg){const old=document.querySelector('.toast');if(old)old.remove();const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),3600)}
function topicSkill(id){return state.skill[id]||{correct:0,wrong:0,run:0,due:null,last:null}}
const mastery=id=>{const s=topicSkill(id),n=s.correct+s.wrong;return n===0?0:Math.round(100*(s.correct/(n+3))*Math.min(1,n/8))};
const dueTopics=()=>TODAY_TOPICS().filter(t=>{const s=topicSkill(t.id);return s.due&&s.due<=TODAY});
const XP_PER_LEVEL=150;const level=()=>Math.floor(state.xp/XP_PER_LEVEL)+1;
function addDays(date,d){const x=new Date(`${date}T12:00:00Z`);x.setUTCDate(x.getUTCDate()+d);return x.toISOString().slice(0,10)}
function streak(){let n=0,date=TODAY;const counts=state.activity; if(!counts[date])date=addDays(date,-1);while(counts[date]){n++;date=addDays(date,-1)}return n}
function bestStreak(){let best=0,run=0,prev=null;for(const d of Object.keys(state.activity).sort()){if(state.activity[d]){run=prev&&addDays(prev,1)===d?run+1:1;best=Math.max(best,run);prev=d}}return best}
function trackTopic(id,ok){const s=topicSkill(id);if(ok){s.correct++;s.run++;const delay=[1,1,3,7,14,28][Math.min(5,s.run)];s.due=addDays(TODAY,delay);s.last=TODAY}else{s.wrong++;s.run=0;s.due=addDays(TODAY,1);s.last=TODAY}state.skill[id]=s}
function useQuestionResult(q,ref,ok,userInput){state.seen[`${q.templateKey}:${q.seed}`]=(state.seen[`${q.templateKey}:${q.seed}`]||0)+1;trackTopic(q.topic,ok);if(ok){state.correct++;state.xp+=ref&&ref.mistakes?12:20;checkBadges();}else{state.wrong++;state.mistakes.unshift({date:TODAY,topic:q.topic,key:q.templateKey,prompt:q.prompt.replace(/<[^>]*>/g,'').slice(0,180),input:String(userInput).slice(0,80)});state.mistakes=state.mistakes.slice(0,60)}save()}
function checkBadges(){const achieved=new Set(state.achievements),possible=[['First proof',state.correct>=1],['Tenacity',state.correct>=10],['Century club',state.correct>=100],['Matrix master',mastery('mat-ops')>=65],['7-day streak',streak()>=7],['Revision legend',state.correct>=500]];for(const [a,cond] of possible)if(cond&&!achieved.has(a)){state.achievements.push(a);showToast(`🏅 Achievement unlocked: ${a}`)}}
function dailyPlan(date){const pool=BANK.filter(x=>byId(x.topic).date<=date);if(!pool.length)return[];const r=rng(h(`axiom:daily:${date}:plan2`));const randint=max=>Math.floor(r()*max);let picked=[],topics=[...new Set(pool.map(p=>p.topic))];
// Pick a different topic while possible, with a recent/older and under-practised mix.
for(let i=0;i<10;i++){const used=new Set(picked.map(p=>p.topic)),candidateTopics=topics.filter(t=>!used.has(t));const options=candidateTopics.length?candidateTopics:topics;const scored=options.map(id=>({id,score:1.6/(1+mastery(id)/70)+(state.skill[id]?.wrong||0)*.13+(r()*.55)+(byId(id).date>=addDays(date,-21)?.27:0)})).sort((a,b)=>b.score-a.score);const pickTopic=scored[Math.min(randint(Math.min(3,scored.length)),scored.length-1)].id;const templates=pool.filter(b=>b.topic===pickTopic&&!picked.some(p=>p.key===b.key));const options2=templates.length?templates:pool.filter(b=>b.topic===pickTopic);const b=options2[randint(options2.length)];const seed=h(`axiom:daily:${date}:${i}:${b.key}:${randint(999999)}`);picked.push({key:b.key,topic:b.topic,seed,solved:false,mistakes:0,hints:0,followupSeed:null,pendingRetry:false,feedback:null})}
return picked}
function getDaily(){if(!state.daily[TODAY]){state.daily[TODAY]={refs:dailyPlan(TODAY),created:TODAY};save()}return state.daily[TODAY]}
function dailyVisible(){return getDaily().refs.slice(0,state.settings.count)}
const dailyComplete=()=>dailyVisible().length>0&&dailyVisible().every(r=>r.solved);
function markDayIfFinished(){if(dailyComplete()&&!state.activity[TODAY]){state.activity[TODAY]=1;state.xp+=35;checkBadges();save();showToast('🌟 Daily challenge complete! +35 XP')}}
function pickPractice(topicId=null,dueOnly=false){const ids=topicId?[topicId]:dueOnly&&dueTopics().length?dueTopics().map(t=>t.id):TODAY_TOPICS().map(t=>t.id);const choices=bankEntries(ids);if(!choices.length)return null;const weights=choices.map(x=>{const t=getTemplate(x.key);const s=topicSkill(t.topic);return 1/(1+Math.min(8,state.seen[`${x.key}:${x.seed}`]||0)*3)+(s.wrong>s.correct?.6:0)+(s.due&&s.due<=TODAY?.7:0)});let sum=weights.reduce((a,b)=>a+b,0),draw=Math.random()*sum,chosen=choices[0];for(let i=0;i<choices.length;i++){draw-=weights[i];if(draw<=0){chosen=choices[i];break}}return {key:chosen.key,seed:chosen.seed,topic:getTemplate(chosen.key).topic,mistakes:0,hints:0,followupSeed:null,pendingRetry:false,feedback:null,solved:false}}
function startPractice(type='random',topic=null){const ref=pickPractice(type==='topic'?topic:null,type==='review');if(!ref){showToast('No questions unlocked yet. Try Topic Explorer!');return}ui.session={type,topic,ref,completed:0,score:0};ui.selectedChoice=null;ui.feedback=null;ui.page=type==='topic'?'explore':'practice';render();jumpTop()}
function nextPractice(){if(!ui.session)return;const {type,topic}=ui.session,ref=pickPractice(type==='topic'?topic:null,type==='review');if(!ref){ui.session=null;render();return}ui.session.ref=ref;ui.selectedChoice=null;render();jumpTop()}
function currentRef(){if(ui.page==='today')return dailyVisible()[ui.dailyIndex];if(ui.session&&((ui.page==='practice'&&['random','review'].includes(ui.session.type))||(ui.page==='explore'&&ui.session.type==='topic')))return ui.session.ref;return null}
function checkAnswer(q,raw){if(q.type==='choice')return Number(raw)===q.correct;const inp=String(raw||'').trim();if(!inp)return false;try{let actuals,expected=Array.isArray(q.correct)?q.correct:[q.correct];if(q.type==='matrix2'){actuals=inp.replace(/^\[/,'').replace(/\]$/,'').split(/[;,]/).map(x=>x.trim())}else if(q.type==='pair'||q.type==='triple'){actuals=inp.replace(/^\(/,'').replace(/\)$/,'').split(',').map(x=>x.trim())}else actuals=[inp];if(actuals.length!==expected.length)return false;return actuals.every((x,i)=>{const a=mathEval(x),b=expected[i],eps=q.tolerance??(Number.isInteger(b)?1e-6:.00015);return Number.isFinite(a)&&Math.abs(a-b)<=eps})}catch(e){return false}}
// Small arithmetic expression parser, with no eval() and no external service.
function mathEval(source){let s=String(source).toLowerCase().replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');const tokens=s.match(/(?:\d*\.\d+(?:e[+\-]?\d+)?|\d+(?:\.\d*)?(?:e[+\-]?\d+)?|sqrt|pi|[+\-*/^()])/g)||[];if(tokens.join('')!==s)throw Error('invalid character');let i=0;function atom(){const t=tokens[i++];if(t==='('){const v=expr();if(tokens[i++]!==')')throw Error('unbalanced');return v}if(t==='pi')return Math.PI;if(t==='sqrt'){let v;if(tokens[i]==='('){i++;v=expr();if(tokens[i++]!==')')throw Error('unbalanced')}else v=unary();return Math.sqrt(v)}const v=Number(t);if(!t||!Number.isFinite(v))throw Error('not a number');return v}function power(){let v=atom();if(tokens[i]==='^'){i++;v=v**unary()}return v}function unary(){if(tokens[i]==='+'){i++;return unary()}if(tokens[i]==='-'){i++;return -unary()}return power()}function term(){let v=unary();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=unary();v=op==='*'?v*r:v/r}return v}function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=term();v=op==='+'?v+r:v-r}return v}const result=expr();if(i!==tokens.length||!Number.isFinite(result))throw Error('invalid');return result}
function answerStr(q){if(q.answerDisplay!==undefined)return String(q.answerDisplay);if(q.type==='choice')return q.options[q.correct];const f=x=>{if(Number.isInteger(x))return String(x);for(let d=1;d<=200;d++){const n=Math.round(x*d);if(Math.abs(x-n/d)<1e-9)return d===1?String(n):`${n}/${d}`}return Number(x).toFixed(5).replace(/0+$/,'').replace(/\.$/,'')};if(q.type==='matrix2')return `${q.correct.slice(0,2).map(f).join(', ')}; ${q.correct.slice(2).map(f).join(', ')}`;if(Array.isArray(q.correct))return q.correct.map(f).join(', ');return f(q.correct)}

<div class="sectionhead"><h2>Topic mastery</h2><span class="smallmuted">A conservative estimate based on answered questions</span></div><div class="topic-grid">${tList.map(t=>`<div class="progress-card"><div class="toggleline" style="justify-content:space-between"><strong style="font-size:13px">${safe(t.title)}</strong><span class="smallmuted">${mastery(t.id)}%</span></div><div class="bar" style="margin:12px 0"><span style="width:${mastery(t.id)}%"></span></div><div class="rowbtm toggleline" style="justify-content:space-between"><span class="smallmuted">${topicSkill(t.id).correct} ✓ · ${topicSkill(t.id).wrong} corrections</span>${action('practice-topic','Practise',`data-topic="${t.id}"`,'btn small')}</div></div>`).join('')}</div>
<div class="sectionhead"><h2>Saved questions</h2><span class="smallmuted">Your bookmarked examples to revisit</span></div><div class="panel">${state.bookmarks.length?state.bookmarks.slice(-12).reverse().map(saved=>{const cut=saved.lastIndexOf(':');const key=saved.slice(0,cut),seed=Number(saved.slice(cut+1)),t=getTemplate(key);return t?`<div class="listline"><div><b>${safe(byId(t.topic).title)}</b><div class="smallmuted">${safe(t.label)}</div></div>${action('open-bookmark','Revisit →',`data-key="${key}" data-seed="${seed}"`,'btn small')}</div>`:''}).join(''):'<p style="font-size:13px">Bookmark a question after answering it, then return to it here whenever you want.</p>'}</div>
<div class="sectionhead"><h2>Recent mistakes</h2><span class="smallmuted">Mistakes are clues, not a score of your ability.</span></div><div class="panel">${state.mistakes.length?state.mistakes.slice(0,10).map(m=>`<div class="listline"><div><b>${safe(byId(m.topic)?.title||'Topic')}</b><div class="smallmuted">${safe(m.prompt)}…</div><div class="smallmuted">${niceDate(m.date)} · Your answer: ${safe(m.input)}</div></div>${action('practice-topic','Try topic',`data-topic="${m.topic}"`,'btn small')}</div>`).join(''):'<div class="empty"><div class="emoji">📈</div><p>Your mistake log appears here once you start practising.</p></div>'}</div>${footer()}`}
function settingsPage(){return `<div class="eyebrow">Make it yours</div><h1>Study settings</h1><p class="subtitle">Choose a manageable routine. Your progress is saved automatically in this browser, with an export option if you change device.</p><div class="panel settingbox" style="margin-top:25px"><div class="settingrow"><div><h3>Daily question count</h3><p>Try 5 on busy days, 7 for balance, or 10 for a longer challenge.</p></div><div class="seg">${[5,7,10].map(n=>`<button data-action="set-count" data-count="${n}" class="${state.settings.count===n?'active':''}">${n}</button>`).join('')}</div></div>
<div class="settingrow"><div><h3>Lesson schedule</h3><p>Topics unlock according to the 2026–27 AMSP Year 1 AQA document you uploaded. Daily and random revision never show future topics.</p></div><span class="chip green">Active</span></div>
<div class="settingrow"><div><h3>Download your progress</h3><p>Export streaks, XP, mistakes, daily answers and your question history in a JSON backup.</p></div>${action('export','Export backup ↓','','btn')}</div>
<div class="settingrow"><div><h3>Restore a backup</h3><p>Import progress from a backup file. This replaces the progress currently stored in this browser.</p></div><label class="btn" for="import-file" style="cursor:pointer">Import backup ↑</label><input type="file" id="import-file" accept=".json,application/json" style="display:none"></div>
<div class="settingrow"><div><h3>Clear all saved progress</h3><p>Remove your local streak, answers, topic mastery, bookmarks and XP. This cannot be undone without a backup.</p></div>${action('reset','Clear progress','','btn danger')}</div></div><div class="notice" style="margin-top:20px">🔒 Privacy: everything runs in your own browser with no accounts or API keys. Progress will not automatically sync between your phone and computer. Export your backup before clearing browser data.</div>${footer()}`}
function footer(){return `<div class="footerline">AXIOM • Inspired by your AMSP AQA Year 1 Further Maths scheme of work (2026–27) • Independent revision companion, not an official AMSP or AQA product.<br>Answers and feedback are generated from built-in mathematical rules. Cross-check any unexpected result with your teacher.</div>`}
function submitCurrent(){const ref=currentRef();if(!ref||ref.feedback||ref.solved)return;const q=build(ref);let raw;if(q.type==='choice'){if(ui.selectedChoice===null){showToast('Choose one of the answers first.');return}raw=ui.selectedChoice}else{raw=document.querySelector('#answer-field')?.value||'';if(!raw.trim()){showToast('Type an answer before checking it.');return}}const ok=checkAnswer(q,raw);ref.feedback={ok,input:q.type==='choice'?q.options[raw]:raw,showSteps:false};if(ok){ref.solved=true;if(ui.session&&ui.page!=='today'){ui.session.completed++;ui.session.score++}useQuestionResult(q,ref,true,raw);if(ui.page==='today')markDayIfFinished()}else{ref.mistakes++;ref.pendingRetry=true;useQuestionResult(q,ref,false,raw)}ui.selectedChoice=null;save();render();if(!ok)document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function retry(){const ref=currentRef();if(!ref||!ref.pendingRetry)return;const previous=build(ref).prompt;let nextSeed=h(`axiom:redo:${ref.seed}:${ref.mistakes}:${ref.key}`);for(let k=0;k<20&&build({...ref,followupSeed:nextSeed}).prompt===previous;k++)nextSeed=h(`${nextSeed}:different:${k}`);ref.followupSeed=nextSeed;ref.feedback=null;ref.pendingRetry=false;ref.hints=0;ui.selectedChoice=null;save();render();document.querySelector('#answer-field')?.focus()}
function nextDaily(){const arr=dailyVisible(),next=arr.findIndex((r,i)=>i>ui.dailyIndex&&!r.solved);if(next>=0)ui.dailyIndex=next;else{const any=arr.findIndex(r=>!r.solved);ui.dailyIndex=any>=0?any:(ui.dailyIndex+1)%arr.length}ui.selectedChoice=null;render();jumpTop()}
function filterCards(){const q=(document.querySelector('#topic-search')?.value||'').toLowerCase().trim(),unit=document.querySelector('#topic-unit')?.value||'All strands',status=document.querySelector('#topic-status')?.value||'All topics';ui.exploreQuery=q;for(const card of document.querySelectorAll('.topiccard'))card.style.display=(!q||card.dataset.topicTitle.includes(q))&&(unit==='All strands'||card.dataset.topicUnit===unit)&&(status==='All topics'||card.dataset.topicStatus===status)?'flex':'none'}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case 'navigate':changePage(el.dataset.page);break;case 'open-daily':changePage('today');break;case 'goto-explore':changePage('explore');break;case 'goto-notes':changePage('notes');break;case 'start-random':startPractice('random');break;case 'start-review':startPractice('review');break;case 'practice-topic':ui.selectedTopic=el.dataset.topic;startPractice('topic',ui.selectedTopic);break;case 'notes-topic':ui.notesTopic=el.dataset.topic;changePage('notes');break;case 'end-topic':ui.session=null;render();break;case 'set-count':state.settings.count=Number(el.dataset.count);save();render();break;case 'go-question':ui.dailyIndex=Number(el.dataset.index)||0;ui.page='today';ui.selectedChoice=null;render();jumpTop();break;case 'skip':{const vis=dailyVisible();ui.dailyIndex=(ui.dailyIndex+1)%vis.length;ui.selectedChoice=null;render();jumpTop();break}case 'submit':submitCurrent();break;case 'select-choice':ui.selectedChoice=Number(el.dataset.index);render();break;case 'retry':retry();break;case 'next-daily':nextDaily();break;case 'next-practice':nextPractice();break;case 'open-bookmark':{const key=el.dataset.key,seed=Number(el.dataset.seed),t=getTemplate(key);if(!t)return;ui.session={type:'topic',topic:t.topic,ref:{key,seed,topic:t.topic,mistakes:0,hints:0,followupSeed:null,pendingRetry:false,feedback:null,solved:false},completed:0,score:0};ui.page='explore';ui.selectedChoice=null;render();jumpTop();break;}case 'show-working':{const ref=currentRef();if(ref?.feedback){ref.feedback.showSteps=true;save();render()}break}case 'hint':{const ref=currentRef();if(ref){ref.hints++;save();render()}break}case 'save-question':{const ref=currentRef();if(!ref)return;const q=build(ref),key=`${q.templateKey}:${q.seed}`,idx=state.bookmarks.indexOf(key);if(idx<0)state.bookmarks.push(key);else state.bookmarks.splice(idx,1);save();render();break}case 'export':{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`axiom-further-maths-backup-${TODAY}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Your backup is ready. Keep it somewhere safe.');break}case 'reset':if(confirm('Clear all AXIOM progress from this browser? This cannot be undone without a backup.')){state=structuredClone(DEFAULT);ui.session=null;ui.dailyIndex=0;save();render();showToast('Saved progress reset.')}break}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer-field'){e.preventDefault();submitCurrent()}});
document.addEventListener('input',e=>{if(e.target.id==='topic-search')filterCards()});document.addEventListener('change',e=>{if(e.target.id==='topic-unit'||e.target.id==='topic-status')filterCards();if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;if(!confirm('Restore this backup and replace current browser progress?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.version!==2||!d.settings||typeof d.xp!=='number'||!Array.isArray(d.mistakes)||typeof d.skill!=='object'||!d.daily)throw Error('This is not a valid AXIOM backup');state={...structuredClone(DEFAULT),...d,settings:{...DEFAULT.settings,...d.settings}};state.settings.count=[5,7,10].includes(state.settings.count)?state.settings.count:7;save();ui.session=null;ui.dailyIndex=0;render();showToast('Backup restored successfully!')}catch(err){showToast('Backup could not be loaded. Check that the file came from AXIOM.')}};r.readAsText(file)}});
// Expose a read-only diagnostic for self-tests from a browser dev console.
Object.defineProperty(window,'axiomDiagnostics',{get:()=>({topics:TOPICS.length,templates:BANK.length,availableVariants:availableBank().length,totalVariants:allBankEntries().length,unlocked:TODAY_TOPICS().length,date:TODAY})});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body></html>
